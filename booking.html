<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>حجز خدمة | Gardenia A</title>
<meta name="description" content="احجز خدمة من جاردينيا A: تسويق، تصوير، تغطية فعاليات، تنظيم وإدارة."/>
<link rel="icon" type="image/svg+xml" href="logo.svg"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
<link rel="stylesheet" href="style.css"/>
</head>
<body data-page="booking.html">
<header class="nav" data-nav></header>

<section class="block">
  <div class="container">
    <div class="head reveal">
      <span class="label">حجز خدمة</span>
      <h2>احجز <span class="gold">موعدك الآن</span></h2>
      <p>املأ البيانات وسيتم إرسال طلبك مباشرة إلى واتساب جاردينيا A.</p>
    </div>

    <div class="grid g2">
      <form class="book card reveal" id="bookForm">
        <input name="name" placeholder="الاسم الكامل" required/>
        <input name="phone" placeholder="رقم الجوال" dir="ltr"/>
        <select name="service" required>
          <option value="التسويق والعلاقات العامة">التسويق والعلاقات العامة</option>
          <option value="التصوير والإنتاج">التصوير والإنتاج</option>
          <option value="تغطية الفعاليات">تغطية الفعاليات</option>
          <option value="تنظيم وإدارة الفعاليات">تنظيم وإدارة الفعاليات</option>
        </select>
        <input name="date" type="date"/>
        <textarea name="details" placeholder="تفاصيل المناسبة أو المشروع"></textarea>
        <button class="btn btn-gold" style="justify-content:center" type="submit">إرسال الطلب على واتساب</button>
      </form>

      <div class="card reveal">
        <h3 class="gold">معلومات سريعة</h3>
        <p>مدة الرد: خلال ساعة في أوقات العمل.</p>
        <p>نخدم مدينة الرياض وجميع مناطق المملكة.</p>
        <p>يمكن تخصيص باقة تناسب ميزانيتك بعد الاستشارة المجانية.</p>
        <div style="margin-top:1rem;display:flex;flex-wrap:wrap;gap:.6rem">
          <a class="btn btn-gold" data-wa target="_blank">واتساب مباشر</a>
          <a class="btn btn-ghost" data-mail>البريد الإلكتروني</a>
        </div>
      </div>
    </div>
  </div>
</section>

<a class="fab" data-wa target="_blank" rel="noopener" aria-label="واتساب"><i class="fa-brands fa-whatsapp"></i></a>
<footer data-footer></footer>
<script src="script.js"></script>
</body>
</html>
