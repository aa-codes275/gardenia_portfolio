<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>معرض الأعمال | Gardenia A</title>
<meta name="description" content="استعرض أعمال جاردينيا A الاحترافية: فيديوهات الفعاليات والتصاميم والإعلانات."/>
<link rel="icon" type="image/svg+xml" href="logo.svg"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
<link rel="stylesheet" href="style.css"/>
</head>
<body data-page="gallery.html">
<header class="nav" data-nav></header>

<section class="gallery-hero-section">
  <div class="container">
    <div class="head reveal" style="margin-bottom:1.2rem;">
      <span class="label">معرض الأعمال الاحترافي</span>
      <h2>أعمال صنعت <span class="gold">الأثر والتميز</span></h2>
      <p>تصفح أحدث الفيديوهات والتصاميم والتغطيات الميدانية بكل سهولة وسرعة.</p>
    </div>

    <!-- فلاتر التبديل السريعة بالأعلى -->
    <div class="gallery-tabs-wrap reveal">
      <div class="gallery-tabs">
        <button class="tab-btn active" data-filter="all"><i class="fa-solid fa-layer-group"></i> الكل</button>
        <button class="tab-btn" data-filter="video"><i class="fa-solid fa-play-circle"></i> الفيديوهات</button>
        <button class="tab-btn" data-filter="design"><i class="fa-solid fa-pen-nib"></i> التصاميم والإعلانات</button>
        <button class="tab-btn" data-filter="events"><i class="fa-solid fa-champagne-glasses"></i> الفعاليات</button>
      </div>
    </div>

    <!-- شبكة عرض الأعمال على الموبايل والكمبيوتر -->
    <div class="mobile-optimized-grid" id="galleryGrid">
      <!-- يتم توليد الكروت ديناميكياً -->
    </div>
  </div>
</section>

<!-- ================= شاشة تفاصيل العمل السينمائية + الشريط السفلي المتحرك ================= -->
<div id="mediaViewerModal" class="media-viewer-modal" aria-hidden="true">
  <div class="viewer-backdrop" id="viewerBackdrop"></div>
  
  <div class="viewer-container">
    <!-- رأس نافذة العرض -->
    <div class="viewer-top-bar">
      <div class="viewer-work-info">
        <span class="viewer-badge" id="viewerBadge">فيديو</span>
        <h3 id="viewerTitle">عنوان العمل</h3>
        <span class="viewer-sub" id="viewerSub">التفاصيل</span>
      </div>
      <div class="viewer-top-actions">
        <a class="btn btn-gold btn-sm viewer-order-btn" id="viewerOrderLink" target="_blank">
          <i class="fa-brands fa-whatsapp"></i> طلب هذا العمل
        </a>
        <button class="viewer-close-btn" id="viewerCloseBtn" aria-label="إغلاق"><i class="fa-solid fa-xmark"></i></button>
      </div>
    </div>

    <!-- منطقة العرض الرئيسية (فيديو أو صورة بحجم مريح وفخم) -->
    <div class="viewer-stage-box">
      <button class="stage-nav prev-btn" id="viewerPrevBtn" aria-label="السابق"><i class="fa-solid fa-chevron-right"></i></button>
      <button class="stage-nav next-btn" id="viewerNextBtn" aria-label="التالي"><i class="fa-solid fa-chevron-left"></i></button>
      
      <div class="stage-viewport" id="stageViewport">
        <!-- يتم حقن الفيديو أو الصورة هنا -->
      </div>
    </div>

    <!-- الشريط السفلي المتحرك لباقي الأعمال (Horizontal Carousel Strip) -->
    <div class="viewer-bottom-strip-wrap">
      <div class="strip-header">
        <span><i class="fa-solid fa-film gold"></i> باقي الأعمال (اضغط للتنقل السريع)</span>
        <span id="stripCounter" class="strip-counter">1 / 10</span>
      </div>
      <div class="viewer-strip-scroll" id="viewerStripScroll">
        <!-- يتم توليد صور مصغرة للأعمال داخل الشريط -->
      </div>
    </div>
  </div>
</div>

<a class="fab" data-wa target="_blank" rel="noopener" aria-label="واتساب"><i class="fa-brands fa-whatsapp"></i></a>
<footer data-footer></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js"></script>
</body>
</html>
