<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>معرض الأعمال | Gardenia A</title>
<meta name="description" content="صور وفيديوهات من أعمال جاردينيا A في تنظيم وتغطية الفعاليات."/>
<link rel="icon" type="image/svg+xml" href="logo.svg"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
<link rel="stylesheet" href="style.css"/>
</head>
<body data-page="gallery.html">
<header class="nav" data-nav></header>

<section class="block">
  <div class="container">
    <div class="head reveal">
      <span class="label">معرض الأعمال</span>
      <h2>لحظات <span class="gold">صنعنا تفاصيلها</span></h2>
      <p>مشغّل وسائط يعرض صور وفيديوهات جاردينيا A. اختر أي عمل من القائمة ليُعرض بالأعلى.</p>
    </div>

    <div class="filters">
      <button class="filter-btn active" data-filter="all">الكل</button>
      <button class="filter-btn" data-filter="design">تصميم وإعلان</button>
      <button class="filter-btn" data-filter="events">فعاليات</button>
      <button class="filter-btn" data-filter="video">فيديوهات</button>
    </div>

    <div class="player reveal in" id="player">
      <div class="stage" id="stage"></div>
      <div class="ctrl">
        <div class="ctrl-row">
          <div class="ctrl-btns">
            <button id="playBtn" type="button" aria-label="تشغيل / إيقاف"><i class="fa-solid fa-play"></i></button>
            <button id="prevBtn" type="button" aria-label="السابق"><i class="fa-solid fa-chevron-right"></i></button>
            <button id="nextBtn" type="button" aria-label="التالي"><i class="fa-solid fa-chevron-left"></i></button>
            <button id="muteBtn" type="button" aria-label="الصوت"><i class="fa-solid fa-volume-high"></i></button>
            <button id="fsBtn" type="button" aria-label="ملء الشاشة"><i class="fa-solid fa-expand"></i></button>
          </div>
          <input id="seek" class="range" type="range" min="0" max="100" value="0" step="0.1" aria-label="التقديم"/>
        </div>
        <div class="ctrl-row bottom">
          <div class="now"><b class="gold" id="nowTitle"></b><small id="nowSub"></small></div>
          <div class="vol-wrap">
            <i class="fa-solid fa-volume-low"></i>
            <input id="vol" class="range vol" type="range" min="0" max="1" value="1" step="0.01" aria-label="مستوى الصوت"/>
            <span class="time" id="time">0:00</span>
          </div>
        </div>
      </div>
    </div>

    <div class="playlist" id="playlist"></div>
  </div>
</section>

<a class="fab" data-wa target="_blank" rel="noopener" aria-label="واتساب"><i class="fa-brands fa-whatsapp"></i></a>
<footer data-footer></footer>
<script src="script.js"></script>
</body>
</html>
